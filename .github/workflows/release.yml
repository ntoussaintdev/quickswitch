name: Release

# Push a tag like v0.3.0 (matching the version in Cargo.toml) to build and publish
# the installer and portable ZIP as a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Check tag matches Cargo.toml version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match Cargo.toml version $version" }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build and package
        shell: pwsh
        run: ./scripts/package.ps1

      # Copies without the version, so README links to releases/latest/download/... never go stale.
      - name: Add unversioned copies
        shell: pwsh
        run: |
          Copy-Item dist/QuickSwitch-*-setup.exe dist/QuickSwitch-setup.exe
          Copy-Item dist/QuickSwitch-*-portable.zip dist/QuickSwitch-portable.zip

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/QuickSwitch-*-setup.exe
            dist/QuickSwitch-*-portable.zip
            dist/QuickSwitch-setup.exe
            dist/QuickSwitch-portable.zip
