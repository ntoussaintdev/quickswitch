[package]
name = "quickswitch"
version = "0.2.1"
edition = "2024"
description = "Spotlight-style window, Explorer tab and folder switcher for Windows 11"
rust-version = "1.88"
build = "build.rs"

[lib]
name = "quickswitch"
path = "src/lib.rs"

[[bin]]
name = "QuickSwitch"
path = "src/main.rs"

[features]
# Build with the wgpu renderer instead of glow, to compare them (plan §9.2, A15).
wgpu = ["eframe/wgpu"]

[dependencies]
crossbeam-channel = "0.5.17"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
global-hotkey = "0.10.0"
nucleo-matcher = "0.3.1"
raw-window-handle = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
tray-icon = "0.26.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_Security", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_IO"] }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
lto = true
codegen-units = 1
strip = true
